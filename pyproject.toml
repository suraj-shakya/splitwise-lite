[project]
name = "splitwise-lite"
version = "0.1.0"
description = "Shared expense ledger for small groups"
requires-python = ">=3.12"
dependencies = ["flask>=3.0,<5"]

[dependency-groups]
dev = ["pytest>=8.0,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splitwise_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
